#:schema node_modules/wrangler/config-schema.json

name = "slotly"
main = "worker/index.ts"
compatibility_date = "2026-11-16"

# The Vite client is built to ./dist and served by Workers static assets.
# /api/* is routed to the Hono Worker. /cancel/* is also Worker-first so the
# guest cancellation page can be served with no-referrer, no-store and noindex
# headers. Every other request falls back to the single-page app.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cancel/*"]

[vars]
ENVIRONMENT = "production"
# Verified sender used by transactional email. Replace with a real verified
# address/domain before enabling email delivery.
EMAIL_FROM = "Slotly <hello@slotly.studio>"
# No verified Resend domain or API key is configured yet, so delivery is
# explicitly disabled instead of logging message payloads to the console.
EMAIL_TRANSPORT = "none"

# Retry undelivered/pending email every 15 minutes. The trigger is active on
# the deployed Worker.
[triggers]
crons = ["*/15 * * * *"]

# Production D1 database. Local `wrangler dev` and `d1 --local` still use the
# Miniflare database and never contact this ID.
[[d1_databases]]
binding = "DB"
database_name = "slotly"
database_id = "e3b8b87c-de92-4f31-bff2-89f0e4aabf3f"
migrations_dir = "migrations"

# PBKDF2 runs in a Durable Object so the 100,000-iteration workerd ceiling fits
# the Workers Free plan's 10 ms CPU budget per request. SQLite-backed classes
# are the Free-plan-compatible storage backend.
[[durable_objects.bindings]]
name = "PASSWORD_HASHER"
class_name = "PasswordHasher"

[[migrations]]
tag = "v1-password-hasher"
new_sqlite_classes = ["PasswordHasher"]
